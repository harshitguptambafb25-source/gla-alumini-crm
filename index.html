<style>
:root{--bg:#f5f7f5;--card:#fff;--text:#17351d;--muted:#6b756e;--brand:#17652a;--brand2:#d9b12b;--line:#dfe6df;--danger:#b42318;--shadow:0 10px 30px #16351a12}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#e4f0e5,transparent 35%),linear-gradient(135deg,#f6faf6,#eef4ef)}.login-card{width:min(440px,92vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.logo{width:82px;height:82px;object-fit:contain;display:block;margin:auto auto 12px}.login h1{text-align:center;margin:0 0 4px;font-size:25px}.login p{text-align:center;color:var(--muted);margin:0 0 25px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#425148}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #17652a15}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#eef4ee;color:var(--brand)}.btn.danger{background:#fff0ef;color:var(--danger)}.btn.gold{background:var(--brand2);color:#17230e}.app{display:flex;min-height:100vh}.side{width:250px;background:#103e1a;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-weight:900;font-size:19px;padding:8px 10px 20px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce9de;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.top h2{margin:0}.user-pill{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:999px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:.2s}.stat:hover{transform:translateY(-2px)}.stat.click{cursor:pointer}.stat .n{font-size:30px;font-weight:900}.stat .l{color:var(--muted);font-size:13px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-top:16px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 15px}.toolbar input{flex:1;min-width:220px;padding:10px;border:1px solid var(--line);border-radius:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{background:#f7faf7;position:sticky;top:0;z-index:1}.idlink{color:var(--brand);font-weight:800;text-decoration:underline;cursor:pointer}.actions{white-space:nowrap}.actions button{margin-right:4px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf5ed;color:var(--brand);font-size:11px;font-weight:800}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.modal{position:fixed;inset:0;background:#06140a99;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;width:min(900px,96vw);max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}.detail{border:1px solid var(--line);border-radius:10px;padding:10px}.detail b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.toast{position:fixed;right:20px;bottom:20px;background:#153b1d;color:#fff;padding:12px 15px;border-radius:10px;z-index:50;box-shadow:var(--shadow)}.empty{padding:35px;text-align:center;color:var(--muted)}canvas{max-height:330px}.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:12px;padding:20px}.danger-text{color:var(--danger)}@media(max-width:850px){.side{width:72px}.brand{font-size:0}.brand:after{content:'GLA';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:20px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid2,.detail-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="login-card">
  <img class="logo" src="https://www.gla.ac.in/wp-content/uploads/2023/08/GLA-University-Logo.png" onerror="this.style.display='none'">
  <h1>GLA Alumni CRM</h1><p>Secure Supabase-powered alumni & engagement management</p>
  <div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="your@email.com"></div>
  <div class="field"><label>Password</label><input id="loginPassword" type="password" placeholder="Password"></div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="login()">Sign in</button>

</div></div>

<div id="appView" class="app hidden">
<aside class="side"><div class="brand">GLA Alumni CRM</div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><div><h2 id="pageTitle">Dashboard</h2><div id="subTitle" style="color:var(--muted);font-size:13px">Live CRM</div></div><div style="display:flex;gap:8px;align-items:center"><span id="userPill" class="user-pill"></span><button class="btn secondary" onclick="logout()">Logout</button></div></div><div id="content"></div><div class="footer">Created by Harshit Kumar Gupta · MBA FMB · 2025-2027 · 9760115295 · For help call/WhatsApp</div></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="btn secondary" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
/* =========================================================
   PASTE YOUR TWO SUPABASE VALUES HERE
   ========================================================= */
const SUPABASE_URL = "https://tojsqxxkijwolqlmvdiv.supabase.co";
const SUPABASE_KEY = "sb_publishable_J9nAJ7mjoEbjTkNyzb_Oew_opn6bHt9";

let sb=null,currentUser=null,currentProfile=null,chart=null;
const tableMap={alumni:'Alumni',students:'Students',companies:'Companies',interactions:'Interactions',mentorships:'Mentorships',connections:'Connections',opportunities:'Opportunities',followups:'Follow-ups',profiles:'User Management'};
const navItems=[['dashboard','📊 Dashboard'],['alumni','👤 Alumni'],['students','🎓 Students'],['companies','🏢 Companies'],['interactions','📞 Interactions'],['mentorships','🤝 Mentorships'],['connections','🔗 Connections'],['opportunities','💼 Opportunities'],['followups','⏰ Follow-ups'],['profiles','👥 User Management']];

function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#8f1d1d':'#153b1d';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pretty(k){return String(k).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function isAdmin(){return currentProfile?.role==='admin'&&currentProfile?.is_active!==false}
function ownerCol(){return 'owner_id'}
function canUse(row){return isAdmin()||row?.owner_id===currentUser?.id||row?.user_id===currentUser?.id||row?.assigned_to===currentUser?.id||row?.caller_id===currentUser?.id}
async function login(){
 if(SUPABASE_URL.startsWith('PASTE_')){document.getElementById('loginMsg').textContent='First paste your Supabase URL and Publishable Key in the code.';return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;
 const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error){document.getElementById('loginMsg').textContent=error.message;return} await boot(data.user)
}
async function boot(user){currentUser=user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error||!p){toast('Profile not found. Ask admin to create/activate your profile.',true);await sb.auth.signOut();return}currentProfile=p;if(p.is_active===false){toast('Your account is inactive.',true);await sb.auth.signOut();return}document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userPill').textContent=`${p.full_name||user.email} · ${p.role||'user'}`;buildNav();route('dashboard')}
function buildNav(){document.getElementById('nav').innerHTML=navItems.filter(x=>isAdmin()||x[0]!=='profiles').map(([k,t])=>`<button id="nav-${k}" onclick="route('${k}')">${t}</button>`).join('')}
function route(k){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+k)?.classList.add('active');document.getElementById('pageTitle').textContent=tableMap[k]||'Dashboard';if(k==='dashboard')dashboard();else tablePage(k)}
async function resetOwnPassword(){const email=document.getElementById('loginEmail').value.trim();if(!email){toast('Enter your email first',true);return}if(SUPABASE_URL.startsWith('PASTE_'))return toast('Configure Supabase in the code first',true);sb=sb||window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?error.message:'Password reset email sent. Check your inbox.',!!error)}
async function logout(){await sb.auth.signOut();location.reload()}
async function getRows(table){let q=sb.from(table).select('*').limit(1000);if(!isAdmin()){if(['profiles'].includes(table))return[];q=q.or(`owner_id.eq.${currentUser.id},user_id.eq.${currentUser.id},assigned_to.eq.${currentUser.id},caller_id.eq.${currentUser.id}`)}const {data,error}=await q;if(error){toast(error.message,true);return[]}return data||[]}
async function getColumns(table){const rows=await getRows(table);const cols=new Set();rows.forEach(r=>Object.keys(r).forEach(k=>cols.add(k)));if(!cols.size){const {data,error}=await sb.from(table).select('*').limit(1);if(!error&&data?.[0])Object.keys(data[0]).forEach(k=>cols.add(k))}return [...cols]}
async function dashboard(){
 document.getElementById('subTitle').textContent='Click any metric to open its records';
 const tables=['alumni','students','companies','interactions','mentorships','connections','opportunities','followups'];const rows={};for(const t of tables)rows[t]=await getRows(t);
 document.getElementById('content').innerHTML=`<div class="cards">${tables.map(t=>`<div class="stat click" onclick="openList('${t}')"><div class="n">${rows[t].length}</div><div class="l">${tableMap[t]} · Click to view</div></div>`).join('')}</div><div class="panel"><h3 style="margin-top:0">CRM Activity Overview</h3><canvas id="crmChart"></canvas></div><div class="panel"><h3 style="margin-top:0">Quick Actions</h3><div class="toolbar"><button class="btn" onclick="openEditor('alumni')">+ Alumni</button><button class="btn" onclick="openEditor('students')">+ Student</button><button class="btn" onclick="openEditor('companies')">+ Company</button><button class="btn" onclick="openEditor('interactions')">+ Log Call</button><button class="btn" onclick="openEditor('mentorships')">+ Mentorship</button><button class="btn" onclick="openEditor('connections')">+ Connection</button></div></div>`;
 setTimeout(()=>{const ctx=document.getElementById('crmChart');if(!ctx)return;if(chart)chart.destroy();chart=new Chart(ctx,{type:'bar',data:{labels:tables.map(t=>tableMap[t]),datasets:[{label:'Records',data:tables.map(t=>rows[t].length)}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})},50)
}
async function openList(k){route(k)}
function renderCell(v,k){if(v===null||v===undefined||v==='')return '—';if(k==='id')return `<span class="idlink" onclick="openById('${esc(v)}')">${esc(v)}</span>`;if(typeof v==='object')return esc(JSON.stringify(v));return esc(v).slice(0,160)}
async function tablePage(k){const rows=await getRows(k);const table=k==='profiles'?'profiles':k;document.getElementById('subTitle').textContent=`${rows.length} visible record(s) · IDs are clickable`;
 const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];const shown=cols.slice(0,16);document.getElementById('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="search" placeholder="Search this section..." oninput="filterTable()"><button class="btn" onclick="openEditor('${k}')">+ Add</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆ Import Excel</button><button class="btn secondary" onclick="exportTable('${k}')">⬇ Export Excel</button><input id="importFile" class="hidden" type="file" accept=".xlsx,.xls,.csv" onchange="importExcel('${k}',this.files[0])"></div><div class="table-wrap"><table class="table" id="dataTable"><thead><tr>${shown.map(c=>`<th>${pretty(c)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${shown.map(c=>`<td>${renderCell(r[c],c)}</td>`).join('')}<td class="actions"><button class="btn secondary" onclick='openRecord(${JSON.stringify(r).replace(/'/g,"&#39;")})'>View</button><button class="btn secondary" onclick='openEditor("${k}",${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick='deleteRow("${table}","${esc(r.id)}")'>Delete</button></td></tr>`).join('')}</tbody></table></div>${!rows.length?'<div class="empty">No records visible yet.</div>':''}</div>`}
function filterTable(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
async function openById(id){for(const t of Object.keys(tableMap)){if(t==='profiles')continue;const {data,error}=await sb.from(t).select('*').eq('id',id).maybeSingle();if(!error&&data){openRecord(data,t);return}}toast('Record not found',true)}
function openRecord(row,source){document.getElementById('modalTitle').textContent=`${source?pretty(source):'Record'} · ${row.id||''}`;document.getElementById('modalBody').innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail"><b>${pretty(k)}</b>${typeof v==='object'?esc(JSON.stringify(v)):esc(v??'—')}</div>`).join('')}</div><div class="toolbar" style="margin-top:16px"><button class="btn" onclick='closeModal();openEditor("${source||"alumni"}",${JSON.stringify(row).replace(/'/g,"&#39;")})'>Edit</button>${source?`<button class="btn danger" onclick='closeModal();deleteRow("${source}","${esc(row.id)}")'>Delete</button>`:''}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function openEditor(k,row){
  if(k==='profiles'){
    adminUserManager();
    return;
  }

  const fields={
    alumni:[
      ['full_name','Full Name','text'],
      ['gender','Gender','text'],
      ['program','Program','text'],
      ['specialization','Specialization','text'],
      ['batch_year','Batch (Year)','number'],
      ['current_job_title','Current Job Title','text'],
      ['current_company_name','Current Company Name','text'],
      ['industry_type','Industry Type','text'],
      ['work_experience_years','Work Experience (Years)','number'],
      ['location_city_country','Location (City, Country)','text'],
      ['contact_number','Contact Number','text'],
      ['email_id','Email ID','email'],
      ['linkedin_profile','LinkedIn Profile','url'],
      ['willingness_to_engage','Willingness to Engage','text'],
      ['preferred_engagement_type','Preferred Engagement Type','text'],
      ['availability','Availability','text'],
      ['past_association','Past Association','text'],
      ['remarks','Remarks','textarea']
    ],

    students:[
      ['full_name','Full Name','text'],
      ['program','Program','text'],
      ['specialization','Specialization','text'],
      ['batch_year','Batch (Year)','number'],
      ['contact_number','Contact Number','text'],
      ['email','Email','email'],
      ['location','Location','text'],
      ['remarks','Remarks','textarea']
    ],

    companies:[
      ['company_name','Company Name','text'],
      ['contact_person_name','Contact Person Name','text'],
      ['designation','Designation','text'],
      ['email_id','Email ID','email'],
      ['linkedin_profile','LinkedIn Profile','url'],
      ['willingness_to_engage','Willingness to Engage','text'],
      ['preferred_engagement_type','Preferred Engagement Type','text'],
      ['availability','Availability','text'],
      ['remarks','Remarks','textarea']
    ],

    interactions:[
      ['alumni_id','Alumni ID','text'],
      ['contact_person','Contact Person','text'],
      ['interaction_date','Interaction Date','date'],
      ['interaction_type','Interaction Type','text'],
      ['outcome','Outcome','text'],
      ['next_action','Next Action','text'],
      ['remarks','Remarks','textarea']
    ],

    opportunities:[
      ['alumni_id','Alumni ID','text'],
      ['company_id','Company ID','text'],
      ['opportunity_type','Opportunity Type','text'],
      ['role_title','Role / Title','text'],
      ['department','Department','text'],
      ['no_of_positions','No. of Positions','number'],
      ['start_date','Start Date','date'],
      ['end_date','End Date','date'],
      ['duration_months','Duration (Months)','number'],
      ['stipend','Stipend','text'],
      ['ctc','CTC','text'],
      ['location','Location','text'],
      ['work_mode','Work Mode','text'],
      ['required_skills','Required Skills','text'],
      ['technical_skills','Technical Skills','text'],
      ['soft_skills','Soft Skills','text'],
      ['qualification','Qualification','text'],
      ['specialization','Specialization','text'],
      ['experience_required','Experience Required','text'],
      ['description','Description','textarea'],
      ['current_stage','Current Stage','text'],
      ['probability','Probability %','number'],
      ['student_assigned','Student Assigned','text'],
      ['priority','Priority','text'],
      ['remarks','Remarks','textarea']
    ],

    mentorships:[
      ['alumni_id','Alumni ID','text'],
      ['student_id','Student ID','text'],
      ['start_date','Start Date','date'],
      ['status','Status','text'],
      ['goals','Goals','textarea'],
      ['remarks','Remarks','textarea']
    ],

    connections:[
      ['alumni_id','Alumni ID','text'],
      ['student_id','Student ID','text'],
      ['connection_type','Connection Type','text'],
      ['connection_strength','Connection Strength','text'],
      ['status','Status','text'],
      ['remarks','Remarks','textarea']
    ],

    followups:[
      ['related_type','Related To','text'],
      ['related_id','Related ID','text'],
      ['follow_up_date','Follow-up Date','date'],
      ['status','Status','text'],
      ['next_action','Next Action','text'],
      ['remarks','Remarks','textarea']
    ]
  };

  const list=fields[k]||[];

  document.getElementById('modalTitle').textContent=
    (row?'Edit ':'Add ')+tableMap[k];

  let html='<form onsubmit="saveForm(event,\''+k+'\','+(row?'true':'false')+')">';

  list.forEach(([name,label,type])=>{
    const value=row?.[name]??'';

    html+='<div class="field">';
    html+='<label>'+esc(label)+'</label>';

    if(type==='textarea'){
      html+='<textarea name="'+esc(name)+'" rows="3">'+esc(value)+'</textarea>';
    }else{
      html+='<input name="'+esc(name)+'" type="'+esc(type)+'" value="'+esc(value)+'">';
    }

    html+='</div>';
  });

  html+='<div style="margin-top:14px">';
  html+='<button class="btn" type="submit">Save</button> ';
  html+='<button class="btn secondary" type="button" onclick="closeModal()">Cancel</button>';
  html+='</div></form>';

  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
}
  async function saveForm(e,table,isEdit){e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries()){if(v!==''&&k!=='id')obj[k]=v}if(!isEdit){if(!('owner_id' in obj)&&!('user_id' in obj)&&!['profiles'].includes(table))obj.owner_id=currentUser.id}let res;if(isEdit){const id=fd.get('id');res=await sb.from(table).update(obj).eq('id',id)}else res=await sb.from(table).insert(obj);if(res.error){toast(res.error.message,true);return}toast('Saved successfully');closeModal();route(table)}
async function deleteRow(table,id){if(!confirm('Delete this record permanently?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error){toast(error.message,true);return}toast('Deleted');route(table)}
function exportTable(k){const rows=window.__lastRows||[];getRows(k).then(r=>{const ws=XLSX.utils.json_to_sheet(r);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,tableMap[k].slice(0,31));XLSX.writeFile(wb,`GLA_CRM_${k}_${new Date().toISOString().slice(0,10)}.xlsx`)})}
async function importExcel(k,file){if(!file)return;try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw new Error('No rows found in file');const cols=await getColumns(k);const valid=rows.map(r=>{const o={};for(const [key,val] of Object.entries(r)){const match=cols.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===key.toLowerCase().replace(/[^a-z0-9]/g,''));if(match&&match!=='id')o[match]=val}if(!('owner_id'in o)&&!('user_id'in o))o.owner_id=currentUser.id;return o}).filter(o=>Object.keys(o).length>0);if(!valid.length)throw new Error('No matching column names found');const {error}=await sb.from(k).insert(valid);if(error)throw error;toast(`${valid.length} rows imported`);route(k)}catch(e){toast(e.message||String(e),true)}}
async function adminUserManager(){const rows=await getRows('profiles');document.getElementById('subTitle').textContent=`${rows.length} user profile(s)`;document.getElementById('content').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn" onclick="openProfileEditor()">+ Add Profile</button><button class="btn secondary" onclick="exportTable('profiles')">⬇ Export Users</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td><span class="badge">${esc(r.role)}</span></td><td>${r.is_active?'Yes':'No'}</td><td><button class="btn secondary" onclick='openRecord(${JSON.stringify(r).replace(/'/g,"&#39;")},"profiles")'>View</button><button class="btn secondary" onclick='openProfileEditor(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick='deleteRow("profiles","${esc(r.id)}")'>Delete</button><button class="btn gold" onclick='sendReset("${esc(r.email)}")'>Reset Password</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function openProfileEditor(row={}){const cols=['id','full_name','email','role','is_active'];document.getElementById('modalTitle').textContent=row.id?'Edit User Profile':'Add User Profile';document.getElementById('modalBody').innerHTML=`<form onsubmit="saveProfile(event,${row.id?1:0})"><div class="grid2"><div class="field"><label>User UUID</label><input name="id" value="${esc(row.id||'')}" ${row.id?'readonly':''} required></div><div class="field"><label>Full name</label><input name="full_name" value="${esc(row.full_name||'')}" required></div><div class="field"><label>Email</label><input name="email" value="${esc(row.email||'')}" type="email" required></div><div class="field"><label>Role</label><select name="role"><option value="user" ${row.role==='user'?'selected':''}>user</option><option value="admin" ${row.role==='admin'?'selected':''}>admin</option></select></div><div class="field"><label>Active</label><select name="is_active"><option value="true" ${row.is_active!==false?'selected':''}>true</option><option value="false" ${row.is_active===false?'selected':''}>false</option></select></div></div><p class="danger-text">Note: Creating an Authentication login requires Supabase Auth/Admin API. This browser UI safely edits the profile; use an Edge Function for creating/deleting Auth users and setting passwords.</p><div class="toolbar"><button class="btn">Save Profile</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`;document.getElementById('modal').classList.remove('hidden')}
async function saveProfile(e,isEdit){e.preventDefault();const fd=new FormData(e.target),o={full_name:fd.get('full_name'),email:fd.get('email'),role:fd.get('role'),is_active:fd.get('is_active')==='true'};let res=isEdit?await sb.from('profiles').update(o).eq('id',fd.get('id')):await sb.from('profiles').insert({...o,id:fd.get('id')});if(res.error){toast(res.error.message,true);return}toast('Profile saved');closeModal();adminUserManager()}
async function sendReset(email){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?error.message:'Password reset email sent',!!error)}
(async()=>{if(!SUPABASE_URL.startsWith('PASTE_')){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data}=await sb.auth.getSession();if(data.session)await boot(data.session.user)}})();
</script>
